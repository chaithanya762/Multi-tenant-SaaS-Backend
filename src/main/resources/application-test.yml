spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:multitenant_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
  cache:
    type: simple

jwt:
  secret: TestSecretKeyThatIsAtLeast64CharactersLongForHMACSHA256SigningAlgorithm!!
  expiration-ms: 900000
  refresh-expiration-ms: 2592000000

logging:
  level:
    com.example.multitenant: DEBUG
